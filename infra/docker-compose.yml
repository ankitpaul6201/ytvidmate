services:
  redis:
    image: redis:7-alpine
    container_name: ytvidmate-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ytvidmate-backend
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - FRONTEND_ORIGIN=http://localhost:3000
      - REDIS_URL=redis://redis:6379/0
      - TMP_DIR=/app/temp
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - temp_storage:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ytvidmate-frontend
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  redis_data:
  temp_storage:
